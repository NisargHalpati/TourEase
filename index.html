<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TourEase | Home</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/home.css">
  <script src="js/main.js" defer></script>
  <script src="js/home.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a class="navbar-brand" href="index.html">TourEase</a>
      <button
        class="navbar-menu-toggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="navbar-links"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="navbar-links" id="navbar-links">
        <a href="index.html" aria-current="page">Home</a>
        <a href="destinations.html">Destinations</a>
        <a href="inspiration.html">Inspirations</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="home-hero" aria-labelledby="home-hero-title">
      <div class="home-hero__image home-hero__image--first is-visible" aria-hidden="true"></div>
      <div class="home-hero__image home-hero__image--second" aria-hidden="true"></div>
      <div class="home-hero__overlay" aria-hidden="true"></div>
      <div class="home-hero__content">
        <h1 class="home-hero__title" id="home-hero-title">India awaits.</h1>
        <p class="home-hero__subtitle">Places worth getting lost in.</p>
        <a class="btn btn-primary home-hero__cta" href="destinations.html">Explore Destinations</a>
      </div>
    </section>
    <section class="top-destinations" aria-labelledby="top-destinations-title">
      <div class="top-destinations__inner">
        <header class="top-destinations__header">
          <p class="top-destinations__eyebrow">Top destinations</p>
          <h2 class="top-destinations__title" id="top-destinations-title">Places worth the journey.</h2>
          <p class="top-destinations__intro">A few places to start exploring India.</p>
        </header>
        <div class="top-destinations__grid" id="top-destinations-grid"></div>
      </div>
    </section>
  </main>
</body>
</html>
